name: Deploy OneClick demo to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ONECLICK/**"
      - ".github/workflows/deploy-oneclick-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "oneclick-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload OneClick site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "ONECLICK"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
