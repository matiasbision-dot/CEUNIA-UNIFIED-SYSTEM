name: CEUNIA MetaCode tests
on:
  push:
    branches:
      - feature/metacode-evolution-nasa-finance
  pull_request:
    branches:
      - main
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run MetaCode unit tests
        run: python -m unittest discover -s tests -v
