name: CEUNIA anticipatory correction
on:
  push:
    branches:
      - feature/ceunia-anticipatory-correction-v1
  pull_request:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused tests
        run: python -m unittest discover -s tests -p "test_anticipatory_correction.py" -v
      - name: Run existing MetaCode tests
        run: python -m unittest discover -s tests -p "test_metacode_evolution.py" -v
