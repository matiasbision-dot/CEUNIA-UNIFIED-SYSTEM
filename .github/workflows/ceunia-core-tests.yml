name: CEUNIA core tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run platform core tests
        run: python -m unittest discover -s tests -v
      - name: Run ONECLICK sandbox demonstration
        run: python -m examples.oneclick_sandbox
      - name: Run ONECLICK intent intake demonstration
        run: python -m examples.oneclick_intake
      - name: Run ONECLICK proposal review demonstration
        run: python -m examples.oneclick_proposal
